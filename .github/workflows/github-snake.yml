# Save as: .github/workflows/github-snake.yml  (in the Sush-Singh/Sush-Singh repo)
# Generates the snake SVGs once a day and pushes them to the "output" branch.
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # every day at 00:00 UTC
  workflow_dispatch: # allow manual runs from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write # needed to push to the "output" branch

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake from the contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # color_dots takes exactly 5 colors: [no contributions, low ... high]
          outputs: |
            dist/github-snake.svg?color_snake=#0c4a6e&color_dots=#e8f4fd,#c5e6fa,#8fd0f5,#4db3ee,#0284c7
            dist/github-snake-dark.svg?color_snake=#e0f4ff&color_dots=#1b3f5e,#2a6190,#3f8ec7,#6bbcf0,#bae6fd

      - name: Push the SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
